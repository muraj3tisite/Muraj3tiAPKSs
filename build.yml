name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon (اختياري - إن وُجد assets/icon-only.png)
        run: |
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets generate --android
          fi

      - name: Sync
        run: npx cap sync android

      - name: Set version code
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build
        working-directory: android
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KS" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - name: Sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > release.jks
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out out/murajaati.apk aligned.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/murajaati.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: murajaati-apk
          path: out/murajaati.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: مراجعتي v${{ github.run_number }}
          files: out/murajaati.apk
